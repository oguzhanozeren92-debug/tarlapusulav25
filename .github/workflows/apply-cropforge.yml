name: Apply CropForge Shadow Readiness

on:
  push:
    branches: [main]
    paths:
      - '.github/cropforge.patch'
      - '.github/workflows/apply-cropforge.yml'

permissions:
  contents: write

jobs:
  apply-cropforge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify and apply CropForge patch
        shell: bash
        run: |
          set -euo pipefail
          test -f .github/cropforge.patch
          git apply --check .github/cropforge.patch
          git apply .github/cropforge.patch

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Python syntax check
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            services/model-gateway/app.py \
            services/model-gateway/engine_registry.py \
            services/model-gateway/smoke_test.py

      - name: Commit verified CropForge readiness
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/cropforge.patch .github/workflows/apply-cropforge.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(models): add CropForge shadow readiness'
          git push origin HEAD:main
