name: Apply CropForge Shadow Readiness

on:
  push:
    branches: [main]
    paths:
      - '.github/cropforge.patch'
      - '.github/workflows/apply-cropforge.yml'

permissions:
  contents: write

jobs:
  apply-cropforge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify and apply CropForge patch
        shell: bash
        run: |
          set -euo pipefail
          test -f .github/cropforge.patch
          git apply --check .github/cropforge.patch
          git apply .github/cropforge.patch

      - name: Wire CropForge into current readiness edge function
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('supabase/functions/model-engine-readiness/index.ts')
          text = path.read_text()

          if 'cropforge:' in text:
              raise SystemExit('cropforge engine already present unexpectedly')

          marker = '\n} as const;'
          if text.count(marker) != 1:
              raise SystemExit(f'engine config marker count={text.count(marker)}')
          cropforge_config = """
            cropforge: {
              adapter: 'pcse-pilot-inputs+aquacrop-pilot-inputs',
              rollout: 'shadow-readiness',
              required: ['field_location', 'daily_weather', 'crop_parameters', 'soil_profile', 'planting_date'],
            },
          } as const;"""
          text = text.replace(marker, '\n' + cropforge_config, 1)

          normalizer_marker = 'function normalizePyFao56('
          if text.count(normalizer_marker) != 1:
              raise SystemExit('normalizePyFao56 anchor missing')
          cropforge_normalizer = """function normalizeCropForge(pcsePayload: any, aquacropPayload: any) {
            const required = [...ENGINE_CONFIG.cropforge.required] as string[];
            const combinedAvailable = new Set([
              ...(Array.isArray(pcsePayload?.available_inputs) ? pcsePayload.available_inputs.map(String) : []),
              ...(Array.isArray(aquacropPayload?.available_inputs) ? aquacropPayload.available_inputs.map(String) : []),
            ]);
            const availableInputs = required.filter((key) => combinedAvailable.has(key));
            const missingInputs = required.filter((key) => !combinedAvailable.has(key));
            return {
              availableInputs,
              missingInputs,
              evidence: {
                pcse_adapter: pcsePayload?.adapters ?? null,
                aquacrop_adapter: aquacropPayload?.adapters ?? null,
              },
              context: {
                cropforge_phase: 'shadow-readiness-v1',
                execution_enabled: false,
                terrain_physics_ready: false,
                terrain_gate: 'verified_topography_required_before_runtime',
                pcse: pcsePayload?.context ?? null,
                aquacrop: aquacropPayload?.context ?? null,
              },
              adapterMissingInputs: [...new Set([
                ...(Array.isArray(pcsePayload?.missing_inputs) ? pcsePayload.missing_inputs.map(String) : []),
                ...(Array.isArray(aquacropPayload?.missing_inputs) ? aquacropPayload.missing_inputs.map(String) : []),
              ])],
            };
          }

          """
          text = text.replace(normalizer_marker, cropforge_normalizer + normalizer_marker, 1)

          old_error = 'Yalnız pyfao56, pcse veya aquacrop readiness desteklenir.'
          if text.count(old_error) != 1:
              raise SystemExit('engine validation anchor missing')
          text = text.replace(old_error, 'Yalnız pyfao56, pcse, aquacrop veya cropforge readiness desteklenir.', 1)

          old_decl = 'let adapterPayload: any; let irrigationBalance: any = null;'
          if text.count(old_decl) != 1:
              raise SystemExit('adapter declaration anchor missing')
          text = text.replace(old_decl, 'let adapterPayload: any; let secondaryAdapterPayload: any = null; let irrigationBalance: any = null;', 1)

          branch_pattern = re.compile(
              r"\n\s{4}\} else \{\n\s{6}adapterPayload = await callAdapter\(supabaseUrl, anonKey, authorization, config\.adapter, fieldId\);\n\s{4}\}"
          )
          branch_replacement = """
            } else if (engine === 'cropforge') {
              const [pcseResult, aquacropResult] = await Promise.allSettled([
                callAdapter(supabaseUrl, anonKey, authorization, 'pcse-pilot-inputs', fieldId),
                callAdapter(supabaseUrl, anonKey, authorization, 'aquacrop-pilot-inputs', fieldId),
              ]);
              if (pcseResult.status === 'rejected' && aquacropResult.status === 'rejected') {
                throw pcseResult.reason;
              }
              adapterPayload = pcseResult.status === 'fulfilled'
                ? pcseResult.value
                : { available_inputs: [], missing_inputs: ['pcse_adapter_unavailable'], context: {}, adapters: {} };
              secondaryAdapterPayload = aquacropResult.status === 'fulfilled'
                ? aquacropResult.value
                : { available_inputs: [], missing_inputs: ['aquacrop_adapter_unavailable'], context: {}, adapters: {} };
            } else {
              adapterPayload = await callAdapter(supabaseUrl, anonKey, authorization, config.adapter, fieldId);
            }"""
          text, branch_count = branch_pattern.subn('\n' + branch_replacement, text, count=1)
          if branch_count != 1:
              raise SystemExit(f'adapter branch anchor count={branch_count}')

          normalized_pattern = re.compile(
              r"const normalized = engine === 'pyfao56' \? normalizePyFao56\(adapterPayload, irrigationBalance, kcbContext, evaporationContext\) : normalizeStandardAdapter\(engine, adapterPayload\);"
          )
          normalized_replacement = """const normalized = engine === 'pyfao56'
              ? normalizePyFao56(adapterPayload, irrigationBalance, kcbContext, evaporationContext)
              : engine === 'cropforge'
                ? normalizeCropForge(adapterPayload, secondaryAdapterPayload)
                : normalizeStandardAdapter(engine, adapterPayload);"""
          text, normalized_count = normalized_pattern.subn(normalized_replacement, text, count=1)
          if normalized_count != 1:
              raise SystemExit(f'normalized anchor count={normalized_count}')

          path.write_text(text)
          PY

          grep -q "cropforge_phase: 'shadow-readiness-v1'" supabase/functions/model-engine-readiness/index.ts
          grep -q "engine === 'cropforge'" supabase/functions/model-engine-readiness/index.ts
          git diff --check

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Python syntax check
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            services/model-gateway/app.py \
            services/model-gateway/engine_registry.py \
            services/model-gateway/smoke_test.py

      - name: Commit verified CropForge readiness
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/cropforge.patch .github/workflows/apply-cropforge.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(models): add CropForge shadow readiness'
          git push origin HEAD:main
