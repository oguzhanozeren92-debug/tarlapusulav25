name: Apply stabilization batch 4

on:
  push:
    branches:
      - 'stabilize/2026-09-23'
    paths:
      - '.github/workflows/apply-stabilization-batch4.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stabilize/2026-09-23
          fetch-depth: 0

      - name: Apply batch 4
        shell: python
        run: |
          from pathlib import Path

          def patch(path, old, new, count=None):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              found = text.count(old)
              if found == 0:
                  raise SystemExit(f'Patch target not found in {path}: {old[:120]!r}')
              if count is not None and found < count:
                  raise SystemExit(f'Expected {count} matches in {path}, found {found}')
              text = text.replace(old, new) if count is None else text.replace(old, new, count)
              p.write_text(text, encoding='utf-8')

          patch('src/features/home-map/components/HomeMapSectionMapFirst.tsx', 'props.notificationCount > 0', '(props.notificationCount ?? 0) > 0')

          patch(
              'src/pages/Home/HomeScreen.tsx',
              '              ndviStats={homeNdviStats}\n              onNdviStats={setHomeNdviStats}',
              '              onNdviStats={setHomeNdviStats}',
              1,
          )

          patch(
              'src/features/irrigation/services/irrigationSynthesis.service.ts',
              'async function loadFieldForPhenology(fieldId: string) {',
              'async function loadFieldForPhenology(fieldId: string): Promise<Record<string, any>> {',
          )
          patch(
              'src/features/pusula-pdf/services/pusulaPdfDecisionEvidence.service.ts',
              'async function loadFieldRecord(fieldId: string, userId: string) {',
              'async function loadFieldRecord(fieldId: string, userId: string): Promise<Record<string, any>> {',
          )

          # WorldCereal active RDM contract.
          patch('src/lib/pusulaFieldContext.ts', "source: 'ESA WorldCereal 10 m 2021 v100',", "source: 'ESA WorldCereal RDM',", 1)
          patch(
              'src/lib/pusulaFieldContext.ts',
              "state: worldCerealResult.value.aez.matched ? 'partial' : 'partial',",
              "state: worldCerealResult.value.status === 'ready' ? 'ready' : worldCerealResult.value.status === 'partial' ? 'partial' : 'unavailable',",
              1,
          )
          patch('src/lib/pusulaFieldContext.ts', 'observedAt: null,\n            confidence: \'low\',', "observedAt: worldCerealResult.value.latestValidityDate,\n            confidence: worldCerealResult.value.sampleCount > 0 ? 'medium' : 'low',", 1)
          patch(
              'src/lib/pusulaFieldContext.ts',
              "'2021 tarihli tarihsel ürün/AEZ referansıdır; güncel ürün kimliği veya güncel sulama kanıtı değildir.',",
              "'WorldCereal RDM yakın saha referans örnekleri tarihsel/model bağlamıdır; güncel ürün kimliği veya sulama kanıtı değildir.',",
              1,
          )
          patch(
              'src/lib/pusulaFieldContext.ts',
              "'Bu aşamada WorldCereal 10 m rasterı parsel üzerinde örneklenmez; yalnız AEZ ve ürün uygunluğu bağlamı kullanılır.',",
              "`${worldCerealResult.value.collectionsQueried} koleksiyon sorgulandı; ${worldCerealResult.value.sampleCount} yakın referans örneği kullanılabildi.`,",
              1,
          )
          patch('src/lib/pusulaFieldContext.ts', 'worldCerealResult.value.crop.note,', 'worldCerealResult.value.productCatalog.note,', 1)

          # NASA Harvest active adapter contract.
          patch('src/lib/pusulaFieldContext.ts', "source: 'NASA Harvest / Agmatix crop-stage-detection',", "source: 'NASA Harvest crop-stage-detection uyarlaması',", 1)
          patch(
              'src/lib/pusulaFieldContext.ts',
              "phenologyResult.value.status === 'ready'\n                ? 'ready'\n                : phenologyResult.value.status === 'unavailable'\n                  ? 'unavailable'\n                  : 'partial',",
              "phenologyResult.value.status === 'usable'\n                ? 'ready'\n                : phenologyResult.value.observationCount > 0\n                  ? 'partial'\n                  : 'unavailable',",
              1,
          )
          patch('src/lib/pusulaFieldContext.ts', 'observedAt: phenologyResult.value.lastDate,', 'observedAt: phenologyResult.value.latestDate,', 1)
          patch(
              'src/lib/pusulaFieldContext.ts',
              "'150 günlük Sentinel-2 NDVI eğrisinden ürün-agnostik A-E gelişim konumu tahminidir.',",
              "'180 güne kadar gerçek Sentinel-2 NDVI gözlemlerinden ürün-agnostik A-E gelişim konumu tahminidir.',",
              1,
          )
          patch(
              'src/lib/pusulaFieldContext.ts',
              "phenologyResult.value.applicable\n                ? `Genel evre: ${phenologyResult.value.stage ?? 'veri yetersiz'}${phenologyResult.value.stageDescriptionTr ? ` · ${phenologyResult.value.stageDescriptionTr}` : ''}.`\n                : 'Çok yıllık/bahçe ürünü için bu genel eğri modeli uygulanmadı.',",
              "`Genel evre: ${phenologyResult.value.stageLabel} · ${phenologyResult.value.stageDescription}.`,\n              ...phenologyResult.value.basis.slice(0, 2),",
              1,
          )

      - name: Commit batch 4
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git diff --cached --check
          git commit -m "fix: close remaining structural type contracts" || exit 0
          git push origin HEAD:stabilize/2026-09-23
