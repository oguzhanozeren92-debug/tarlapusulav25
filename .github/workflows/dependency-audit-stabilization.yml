name: Dependency audit stabilization

on:
  push:
    branches:
      - 'stabilize/2026-09-23'
    paths:
      - '.github/workflows/dependency-audit-stabilization.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Show dependency audit
        run: npm audit --json || true

      - name: Show top-level dependency tree
        run: npm ls --depth=1 || true
