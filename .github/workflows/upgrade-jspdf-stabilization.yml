name: Upgrade jsPDF stabilization

on:
  push:
    branches:
      - 'stabilize/2026-09-23'
    paths:
      - '.github/workflows/upgrade-jspdf-stabilization.yml'

permissions:
  contents: write

jobs:
  upgrade:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stabilize/2026-09-23
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install patched jsPDF
        run: npm install jspdf@4.2.1 --save

      - name: Verify lock resolves patched jsPDF
        run: npm ls jspdf

      - name: Commit package update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git diff --cached --check
          git commit -m "security: upgrade jsPDF to 4.2.1" || exit 0
          git push origin HEAD:stabilize/2026-09-23
